<!DOCTYPE html>
<html lang="id">
<head>

<title>SurveiKu - Platform Survei</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0E6;--side:#EEE2CC;--card:#FFFBF4;--ink:#3B2A1C;--mute:#8A7461;--acc:#B08A57;--acc2:#8C6A3F;--line:#E6D8C0;--row:#F8F1E4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Poppins,sans-serif}
h1,h2,h3{font-family:Lora,serif;margin:0;font-weight:600}
.app{display:grid;grid-template-columns:1fr 248px;min-height:100vh}
aside{background:var(--side);border-left:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:30px}
.lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#8C6A3F,#C9A66B);color:#fff;display:grid;place-items:center;font:700 22px Lora,serif}
.logo b{font:600 20px Lora,serif;display:block;line-height:1.1}.logo small{color:var(--mute);font-size:11px}
.nv{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:500 14px Poppins,sans-serif;padding:11px 14px;border-radius:12px;cursor:pointer;margin-bottom:4px}
.nv:hover{background:var(--row)}.nv.on{background:var(--acc2);color:#fff}
main{padding:34px 44px 60px;max-width:1180px;width:100%}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.hd h1{font-size:32px}.sub{color:var(--mute);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(120,90,50,.07);margin-bottom:20px;overflow-x:auto}
.btn{font:500 14px Poppins,sans-serif;background:var(--acc2);color:#fff;border:0;border-radius:11px;padding:10px 20px;cursor:pointer}
.btn.g{background:transparent;color:var(--acc2);border:1px solid var(--acc)}.btn.s{padding:6px 14px;font-size:13px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--row);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.qb{display:grid;grid-template-columns:1fr 190px 40px;gap:10px;margin-bottom:10px;align-items:start}.qb .qo{grid-column:1/3}
.x{border:0;background:var(--row);border-radius:10px;height:40px;cursor:pointer;color:var(--mute)}
.it{background:var(--row);border-radius:12px;padding:10px 12px;margin-top:8px;display:grid;grid-template-columns:1fr repeat(5,52px);gap:4px;align-items:center}
.it label{display:flex;justify-content:center;padding:5px;cursor:pointer}
.it input[type=radio]{appearance:none;width:20px;height:20px;border:2px solid var(--acc);border-radius:50%;background:transparent;cursor:pointer}
.it input:checked{background:radial-gradient(circle,var(--acc2) 45%,transparent 50%);border-color:var(--acc2)}
.md{position:fixed;inset:0;background:rgba(40,28,16,.45);display:none;place-items:center;z-index:9;padding:20px}.md.on{display:grid}.md .card{width:min(720px,100%);margin:0}
.note{color:var(--mute);font-size:13px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.st .card{margin:0}
.st b{font:600 32px Lora,serif;color:var(--acc2);display:block}.st span{color:var(--mute);font-size:13px}
.ar{display:grid;grid-template-columns:200px 1fr 60px;gap:12px;align-items:center;margin:9px 0}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.dbok{background:#E8F5E9;border:1px solid #A5D6A7;border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px}
.dberr{background:#FFEBEE;border:1px solid #EF9A9A;border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px;color:#B71C1C}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div class="app">
<aside>
<div class="logo"><div class="lg">S</div><div><b>SurveiKu</b><small>Database: JSONBlob (cloud)</small></div></div>
<button class="nv" data-go="home">Dashboard</button>
<button class="nv" data-go="new">Buat Survei</button>
<button class="nv" data-go="pickfill">Isi Survei</button>
<button class="nv" data-go="pickres">Hasil dan Laporan</button>
<div id="lgs" style="margin-top:20px"></div>
<p class="note" id="stt" style="margin:14px 8px 0;font-size:12px"></p>
</aside>
<main id="m"></main>
</div>

<div class="md" id="lm"><div class="card"><h3 style="margin-bottom:10px">Masuk</h3><label class="note">Nama Anda</label><input id="ln" placeholder="Contoh: Laila Azahra" style="margin:4px 0 12px"><label class="note">Masuk sebagai</label><div style="margin:6px 0 12px"><label style="display:block;padding:6px 0"><input type="radio" name="lr" value="pembuat" checked> Pembuat survei</label><label style="display:block;padding:6px 0"><input type="radio" name="lr" value="responden"> Responden</label></div><p style="margin:0"><button class="btn" id="lgo">Masuk</button> <button class="btn g" id="lcx">Batal</button> <span class="note" id="lerr"></span></p></div></div>

<div class="md" id="setupm"><div class="card"><h3 style="margin-bottom:10px">Aktifkan Database Bersama</h3><p class="note" style="margin:0 0 12px">Tekan tombol di bawah. Web akan membuat database online (JSONBlob) lalu memberi 1 tautan resmi. Tautan itu yang dibagikan ke semua orang (teman, dosen). Data tersimpan di cloud, bukan di browser.</p><button class="btn" id="mk">Buat database bersama</button><div id="mo" class="note" style="margin-top:12px"></div></div></div>

<script>
/* ============================================================
   SURVEIKU - dengan JSONBlob sebagai database cloud
   - TIDAK pakai localStorage untuk data (kecuali cache user)
   - TIDAK pakai Firebase
   - Data survei & respons tersimpan permanen di cloud
   - Laporan PDF otomatis menyesuaikan survei yang dipilih
   ============================================================ */

var DB_URL='https://jsonblob.com/api/jsonBlob/';
var $=function(s){return document.querySelector(s)},M=$('#m');
var st={s:[],r:{},user:null,blobId:null,loaded:false};
var cur='home',arg=null;

function E(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ====== JSONBlob API ====== */
function dbGet(){
  if(!st.blobId)return Promise.reject(new Error('Database belum dibuat'));
  return fetch(DB_URL+st.blobId,{headers:{'Content-Type':'application/json','Accept':'application/json'},cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(d){d=d||{};st.s=d.surveys||[];st.r=d.resp||{};st.loaded=true;return d});
}
function dbPut(data){
  if(!st.blobId)return Promise.reject(new Error('Database belum dibuat'));
  return fetch(DB_URL+st.blobId,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status)});
}
function dbMutate(fn){
  return dbGet().then(function(d){
    d=d||{};d.surveys=d.surveys||[];d.resp=d.resp||{};d.done=d.done||[];
    var err=fn(d);if(err)throw err;
    return dbPut(d).then(function(){st.s=d.surveys;st.r=d.resp;return d});
  });
}
function dbCreate(){
  return fetch(DB_URL.replace(/\/$/,''),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({surveys:[],resp:{},done:[]})})
    .then(function(r){
      var loc=r.headers.get('Location')||r.headers.get('X-jsonblob')||'';
      var id=loc.split('/').pop();
      if(!id)throw new Error('ID tidak terbaca');
      return id;
    });
}

/* ====== Seed data transportasi (HANYA untuk survei default pertama kali) ====== */
var SEED_D=[["Tarif dan biaya",["Tarif yang dikenakan terjangkau dan sesuai anggaran","Penyesuaian tarif pada jam sibuk masih wajar","Biaya perjalanan sepadan dengan jarak yang ditempuh"]],
["Promo dan transparansi",["Promo atau diskon yang diberikan menarik dan membantu","Rincian biaya transparan sebelum pesanan dikonfirmasi","Metode pembayaran non tunai berfungsi dengan lancar"]],
["Kualitas kendaraan",["Kondisi kendaraan bersih dan terawat","Helm yang disediakan bersih dan layak pakai","Fasilitas pendukung di kendaraan memadai"]],
["Keselamatan berkendara",["Pengemudi berkendara sesuai aturan lalu lintas","Kecepatan berkendara terasa aman dan terkendali","Pengemudi tidak menggunakan ponsel saat berkendara"]],
["Fitur keamanan aplikasi",["Fitur keamanan darurat mudah diakses","Fitur pelacakan perjalanan berfungsi dengan baik","Saya merasa terlindungi saat memakai layanan"]],
["Waktu penjemputan",["Waktu tunggu penjemputan singkat","Pengemudi tiba di titik jemput tepat waktu","Estimasi waktu kedatangan akurat"]],
["Rute dan perjalanan",["Pengemudi memilih rute yang efisien","Pengemudi menanyakan preferensi rute","Waktu sampai di tujuan sesuai estimasi"]],
["Performa aplikasi",["Sistem aplikasi responsif","Proses pencarian pengemudi cepat","Tampilan menu aplikasi mudah dipahami"]],
["Pelayanan pengemudi",["Pengemudi bersikap ramah dan sopan","Pengemudi sigap membantu","Secara keseluruhan saya puas dengan pelayanan pengemudi"]]];

function makeSeedQuestions(){
  var q=[];SEED_D.forEach(function(a){a[1].forEach(function(t){q.push({t:t,type:'likert',g:a[0]})})});
  q.push({t:'Kritik dan saran untuk peningkatan layanan',type:'text',g:'Kritik dan Saran'});
  return q;
}

/* ====== Init: cek blobId dari URL atau cache ====== */
function getBlobId(){
  var m=/[#&]db=([^&]+)/.exec(location.hash);
  if(m)return m[1];
  try{return sessionStorage.getItem('sf_db')||''}catch(e){return ''}
}
function setBlobId(id){
  try{sessionStorage.setItem('sf_db',id)}catch(e){}
  location.hash='#db='+id;
}

/* ====== User (cache di sessionStorage, bukan localStorage) ====== */
function getUser(){try{return JSON.parse(sessionStorage.getItem('sf_user'))}catch(e){return null}}
function setUser(u){st.user=u;try{sessionStorage.setItem('sf_user',JSON.stringify(u))}catch(e){}}
function clearUser(){st.user=null;try{sessionStorage.removeItem('sf_user')}catch(e){}}

/* ====== Statistika ====== */
function stat(a){var n=a.length;if(!n)return null;var m=a.reduce(function(x,y){return x+y},0)/n,s=a.slice().sort(function(x,y){return x-y}),md=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,sd=n>1?Math.sqrt(a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/(n-1)):0;return{n:n,m:m,md:md,sd:sd}}
function nm(sv,j){return st.r[sv.id].map(function(r){return +r[j]}).filter(function(x){return x>0})}
function csi(sv){var a=[];sv.qs.forEach(function(q,j){if(q.type=='likert')a=a.concat(nm(sv,j))});var s=stat(a);return s?s.m/5*100:null}
function sv_(id){return st.s.filter(function(s){return s.id==id})[0]}
function canEdit(s){return st.user&&st.user.role=='pembuat'&&s.owner==st.user.uid}

/* ============================================================
   LAPORAN PDF - DINAMIS (tidak ada hardcode data transportasi)
   Semua angka diambil dari st.r[s.id] yang real
   ============================================================ */
async function lapPDF(){
  var J=window.jspdf;if(!J||!J.jsPDF){alert('Library PDF belum termuat.');return}
  var s=sv_(arg);if(!s){alert('Survei tidak ditemukan');return}
  var n=st.r[s.id].length;
  
  // Kelompokkan pertanyaan likert per aspek
  var gs=[],gmap={};
  s.qs.forEach(function(q,j){if(q.type=='likert'){if(!gmap[q.g]){gmap[q.g]=[];gs.push(q.g)}gmap[q.g].push(j)}});
  
  function qcol(j){return st.r[s.id].map(function(r){return +r[j]}).filter(function(x){return x>0})}
  var ga=gs.map(function(g){var a=[];gmap[g].forEach(function(j){a=a.concat(qcol(j))});return stat(a)});
  var all=[];s.qs.forEach(function(q,j){if(q.type=='likert')all=all.concat(qcol(j))});
  var S=stat(all),csiVal=S?S.m/5*100:null;
  var items=s.qs.map(function(q,j){return j}).filter(function(j){return s.qs[j].type=='likert'});
  var im=items.map(function(j){return stat(qcol(j))});
  var dist=all.reduce(function(a,x){a[x-1]++;return a},[0,0,0,0,0]);
  var gdist=gs.map(function(){return [0,0,0,0,0]});
  gs.forEach(function(g,i){gmap[g].forEach(function(j){st.r[s.id].forEach(function(r){var x=+r[j];if(x>=1&&x<=5)gdist[i][x-1]++})})});
  
  function f1(x){return x.toFixed(1)}function f2(x){return x.toFixed(2)}
  
  var d=new J.jsPDF({unit:'pt',format:'a4'});
  var PW=595,PH=842,MX=50,CW=PW-MX*2,BTM=PH-55,y=0;
  
  function C(t,size,gap,bold){d.setFont('times',bold?'bold':'normal');d.setFontSize(size||12);d.text(t,PW/2,y,{align:'center'});y+=gap||18}
  function H(t){d.setFont('times','bold');d.setFontSize(12);d.text(t,MX,y);y+=18}
  function Pg(t,size){
    d.setFont('times','normal');d.setFontSize(size||11);
    var L=d.splitTextToSize(t,CW);
    // Anti halaman nanggung: kalau sisa < 60pt, langsung page baru
    if(y+L.length*(size||11)*1.45>BTM){d.addPage();y=60}
    d.text(L,MX,y);y+=L.length*(size||11)*1.45+5
  }
  function cap(t){d.setFont('times','bold');d.setFontSize(10);d.text(t,MX,y);y+=14}
  function TBL(head,body,fs,wd){
    if(!body.length)return;
    var o={startY:y,head:[head],body:body,styles:{font:'times',fontSize:fs||9,cellPadding:2.5,fillColor:[255,255,255],textColor:[0,0,0],lineColor:[60,60,60],lineWidth:.3},headStyles:{fillColor:[255,255,255],textColor:[0,0,0],lineColor:[0,0,0],lineWidth:.4},margin:{left:MX,right:MX}};
    if(wd)o.columnStyles=wd;
    d.autoTable(o);y=d.lastAutoTable.finalY+12
  }
  function newPage(){d.addPage();y=60}
  function checkSpace(need){if(y+need>BTM)newPage()}
  
  /* ===== COVER ===== */
  y=70;
  C('LAPORAN HASIL SURVEI',14,10,true);
  d.setFont('times','bold');d.setFontSize(14);
  var TL=d.splitTextToSize(s.title,CW-40);
  d.text(TL,PW/2,y,{align:'center'});y+=TL.length*18+12;
  if(s.ownerName)C('Disusun oleh: '+s.ownerName,12,18,true);
  C('Dicetak: '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),11,13);
  y+=20;
  
  /* ===== KATA PENGANTAR ===== */
  newPage();C('KATA PENGANTAR',14,26,true);
  Pg('Puji syukur penulis panjatkan ke hadirat Tuhan Yang Maha Esa atas rahmat dan karunia-Nya sehingga laporan survei yang berjudul "'+s.title+'" ini dapat diselesaikan dengan baik.');
  Pg('Laporan ini disusun berdasarkan hasil survei yang dikumpulkan melalui aplikasi SurveiKu. Penulis mengucapkan terima kasih kepada semua pihak yang telah membantu, serta kepada seluruh responden yang telah bersedia mengisi kuesioner.');
  Pg('Penulis menyadari bahwa laporan ini masih memiliki keterbatasan. Oleh karena itu, kritik dan saran yang membangun sangat penulis harapkan demi perbaikan di masa mendatang.');
  y+=36;
  var dateStr='Dumai, '+new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  d.text(dateStr,PW-MX,y,{align:'right'});y+=18;
  d.text('Penulis',PW-MX,y,{align:'right'});
  
  /* ===== DAFTAR ISI ===== */
  newPage();C('DAFTAR ISI',14,26,true);
  var tocItems=['KATA PENGANTAR','DAFTAR ISI','DAFTAR TABEL','DAFTAR GAMBAR','BAB I  PENDAHULUAN','BAB II  TINJAUAN PUSTAKA','BAB III  METODE PENELITIAN','BAB IV  HASIL DAN PEMBAHASAN','BAB V  PENUTUP','DAFTAR PUSTAKA','LAMPIRAN'];
  tocItems.forEach(function(t){d.setFont('times','normal');d.setFontSize(11);d.text(t,MX,y);y+=17});
  
  /* ===== BAB I ===== */
  newPage();C('BAB I',14,10,true);C('PENDAHULUAN',14,26,true);
  H('1.1  Latar Belakang');
  Pg('Survei ini dilakukan untuk mengukur persepsi dan kepuasan responden terhadap objek yang diteliti. Pengukuran dilakukan menggunakan kuesioner daring yang disebarluaskan kepada responden secara sukarela. Hasil survei ini diharapkan dapat memberikan gambaran kuantitatif yang dapat dipertanggungjawabkan secara statistik.');
  H('1.2  Rumusan Masalah');
  Pg('Rumusan masalah penelitian ini adalah: (1) bagaimana tingkat kepuasan responden secara keseluruhan; (2) aspek mana yang memperoleh penilaian tertinggi dan terendah; dan (3) aspek apa yang perlu diprioritaskan untuk perbaikan.');
  H('1.3  Tujuan');
  Pg('Penelitian ini bertujuan mengukur tingkat kepuasan menggunakan Customer Satisfaction Index (CSI), memetakan distribusi jawaban pada setiap aspek, serta merumuskan rekomendasi berbasis data.');
  H('1.4  Manfaat');
  Pg('Hasil survei diharapkan menjadi masukan bagi pihak terkait dalam meningkatkan mutu layanan/objek yang diteliti, serta menjadi latihan penerapan statistika deskriptif.');
  
  /* ===== BAB II ===== */
  newPage();C('BAB II',14,10,true);C('TINJAUAN PUSTAKA',14,26,true);
  H('2.1  Kepuasan dan Kualitas Layanan');
  Pg('Kepuasan merupakan perasaan senang atau kecewa yang muncul setelah membandingkan kinerja suatu produk atau jasa dengan harapan (Kotler & Keller, 2016). Pengukuran kepuasan secara berkala diperlukan agar penyedia layanan dapat mengidentifikasi aspek yang sudah baik maupun yang perlu diperbaiki.');
  H('2.2  Skala Likert dan Customer Satisfaction Index');
  Pg('Skala Likert digunakan untuk mengukur sikap, pendapat, dan persepsi seseorang terhadap suatu fenomena (Sugiyono, 2019). CSI merupakan indeks yang menghitung tingkat kepuasan secara menyeluruh dari rata-rata skor penilaian terhadap skor maksimum: CSI = (rata-rata / skor maksimum) x 100%.');
  H('2.3  Statistika Deskriptif');
  Pg('Statistika deskriptif meringkas data melalui frekuensi, persentase, rata-rata, median, dan simpangan baku (Field, 2018; Ghozali, 2018).');
  
  /* ===== BAB III ===== */
  newPage();C('BAB III',14,10,true);C('METODE PENELITIAN',14,26,true);
  H('3.1  Jenis Penelitian');
  Pg('Penelitian ini bersifat deskriptif kuantitatif dengan pendekatan survei. Data dikumpulkan melalui kuesioner daring dari '+n+' responden yang dipilih secara sukarela.');
  H('3.2  Instrumen');
  Pg('Instrumen terdiri atas '+items.length+' pernyataan skala Likert 1-5 yang dikelompokkan ke dalam '+gs.length+' aspek'+(gs.length?': '+gs.join(', '):'')+'. Skala: 1 = Sangat Tidak Setuju, 2 = Tidak Setuju, 3 = Netral, 4 = Setuju, 5 = Sangat Setuju.');
  H('3.3  Teknik Analisis Data');
  Pg('Analisis dilakukan dengan statistika deskriptif dan perhitungan CSI. Kriteria CSI disajikan pada Tabel 1.');
  cap('Tabel 1. Kriteria Customer Satisfaction Index');
  TBL(['Rentang CSI (%)','Kriteria'],[['81 - 100','Sangat Puas'],['66 - 80','Puas'],['51 - 65','Cukup Puas'],['35 - 50','Kurang Puas'],['0 - 34','Tidak Puas']],9,{0:{cellWidth:200},1:{cellWidth:290}});
  
  /* ===== BAB IV ===== */
  newPage();C('BAB IV',14,10,true);C('HASIL DAN PEMBAHASAN',14,26,true);
  
  if(n===0){
    Pg('Belum ada responden yang mengisi survei ini. Silakan bagikan tautan survei kepada responden terlebih dahulu, lalu unduh ulang laporan setelah ada respons masuk.');
  } else {
    H('4.1  Distribusi Jawaban Keseluruhan');
    cap('Tabel 2. Distribusi Jawaban Keseluruhan');
    var dn=all.length||1;
    TBL(['Skor','Kategori','Persentase (%)'],[['1','Sangat Tidak Setuju',f1(dist[0]/dn*100)],['2','Tidak Setuju',f1(dist[1]/dn*100)],['3','Netral',f1(dist[2]/dn*100)],['4','Setuju',f1(dist[3]/dn*100)],['5','Sangat Setuju',f1(dist[4]/dn*100)]],9,{0:{cellWidth:60},1:{cellWidth:330},2:{cellWidth:100}});
    Pg('Dari '+dn+' jawaban, '+f1((dist[3]+dist[4])/dn*100)+'% berada pada kategori Setuju dan Sangat Setuju, '+f1(dist[2]/dn*100)+'% netral, dan '+f1((dist[0]+dist[1])/dn*100)+'% bernilai negatif. Rata-rata keseluruhan adalah '+f2(S.m)+' dari 5, dengan CSI sebesar '+f1(csiVal)+'%.');
    
    H('4.2  Indeks Kepuasan per Aspek');
    cap('Tabel 3. Rata-rata dan CSI per Aspek');
    function csiKrit(p){return p>=81?'Sangat Puas':p>=66?'Puas':p>=51?'Cukup Puas':p>=35?'Kurang Puas':'Tidak Puas'}

    });

  }
  
  /* ===== BAB V ===== */

  else{

    if(rank.length){

    }
  }
  H('5.2  Saran');

  H('5.3  Keterbatasan');
  Pg('Jumlah responden (n = '+n+') dan dipilih secara sukarela, sehingga hasil tidak dapat digeneralisasi ke seluruh populasi.');
  
  /* ===== DAFTAR PUSTAKA ===== */
  newPage();C('DAFTAR PUSTAKA',14,26,true);
  ['Field, A. (2018). Discovering statistics using IBM SPSS Statistics (5th ed.). SAGE Publications.',
   'Ghozali, I. (2018). Aplikasi analisis multivariate dengan program IBM SPSS 25 (9th ed.). Badan Penerbit Universitas Diponegoro.',
   'Kotler, P., & Keller, K. L. (2016). Marketing management (15th ed.). Pearson Education.',

  Pg('Kuesioner terdiri atas '+items.length+' pernyataan skala Likert yang dikelompokkan ke dalam '+gs.length+' aspek.');
  var rows1=[];
  gs.forEach(function(g){gmap[g].forEach(function(j,k){rows1.push([k===0?g:'','X'+(items.indexOf(j)+1),s.qs[j].t])})});
  TBL(['Aspek','Kode','Pernyataan'],rows1,8,{0:{cellWidth:150},1:{cellWidth:40},2:{cellWidth:300}});
  
  if(n>0){

    checkSpace(60);

/* ====== CSV & JSON ====== */
function toCSV(s){
  var q=function(v){v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '\ufeff'+[['No'].concat(s.qs.map(function(x){return x.t}))].concat(st.r[s.id].map(function(r,i){return[i+1].concat(s.qs.map(function(x,j){return r[j]==null?'':r[j]}))})).map(function(r){return r.map(q).join(';')}).join('\r\n')+'\r\n';
}
function toJSON(s){
  return JSON.stringify({survei:{id:s.id,judul:s.title,deskripsi:s.desc||'',diekspor:new Date().toISOString()},jumlah_responden:st.r[s.id].length,pertanyaan:s.qs.map(function(q,j){var o={kode:'Q'+(j+1),teks:q.t,tipe:q.type,kelompok:q.g};if(q.o)o.opsi=q.o;return o}),jawaban:st.r[s.id].map(function(r,i){var o={no:i+1};s.qs.forEach(function(q,j){var v=r[j];o['Q'+(j+1)]=(q.type=='likert'&&v!==''&&v!=null)?+v:(v==null?'':v)});return o})},null,2);
}
function dl(name,mime,text){
  var blob=new Blob([text],{type:mime+';charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
}
function slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'survei'}
function exp(k){
  var s=sv_(arg);var b=slug(s.title)+'-'+new Date().toISOString().slice(0,10);
  if(k=='lap')return lapPDF();
  if(k=='pdf')return pdfRingkas();
  if(k=='json')return dl(b+'.json','application/json',toJSON(s));
  return dl(b+'.csv','text/csv',toCSV(s));
}

  var s=sv_(arg);if(!s){M.innerHTML='<div class="card">Survei tidak ditemukan.</div>';return}
  var n=(st.r[s.id]||[]).length,c=csi(s);
  var h='<div class="hd"><div><h1>Hasil dan Laporan</h1><p class="sub">'+E(s.title)+'</p></div><div><button class="btn" data-ex="lap">Unduh Laporan Lengkap (PDF)</button> <button class="btn g" data-ex="pdf">PDF Ringkas</button> <button class="btn g" data-ex="csv">CSV</button> <button class="btn g" data-ex="json">JSON</button></div></div>';
  h+='<div class="st"><div class="card"><b>'+n+'</b><span>Responden</span></div><div class="card"><b>'+(c==null?'-':c.toFixed(1)+'%')+'</b><span>CSI</span></div></div>';
  if(n===0)h+='<div class="card"><p class="note">Belum ada responden. Bagikan tautan survei, lalu setelah ada yang mengisi, unduh laporan — datanya akan otomatis masuk.</p></div>';
  M.innerHTML=h;
}

function doDel(i){
  if(!confirm('Hapus survei ini?'))return;
  dbMutate(function(d){d.surveys=d.surveys.filter(function(x){return !(x.id==i&&x.owner==st.user.uid)});delete d.resp[i]}).then(function(){home()});
}

/* ====== Login ====== */
function showLogin(){$('#lerr').textContent='';$('#lm').classList.add('on');$('#ln').focus()}
function doLogout(){clearUser();render()}
$('#lgo').onclick=function(){
  var n=$('#ln').value.trim();if(!n){$('#lerr').textContent='Isi nama.';return}
  var role=document.querySelector('input[name=lr]:checked').value;
  setUser({uid:'l_'+n.toLowerCase().replace(/\s+/g,'_'),displayName:n,role:role});
  $('#lm').classList.remove('on');render();
};
$('#lcx').onclick=function(){$('#lm').classList.remove('on')};

/* ====== Setup database ====== */
$('#mk').onclick=function(){
  $('#mo').textContent='Membuat database...';
  dbCreate().then(function(id){
    setBlobId(id);
    $('#mo').innerHTML='<b>Berhasil!</b> Database ID: <code>'+id+'</code><br><br>Sekarang web akan dimuat ulang dengan database aktif. Bagikan URL ke teman/dosen.<br><br><button class="btn" onclick="location.reload()">Lanjut</button>';
  }).catch(function(e){$('#mo').textContent='Gagal: '+e.message+'. Periksa koneksi internet.'});
};

/* ====== Event delegation ====== */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go]');if(t){go(t.dataset.go,t.dataset.id);return}
  t=e.target.closest('[data-ex]');if(t){exp(t.dataset.ex);return}
  t=e.target.closest('[data-del]');if(t){doDel(t.dataset.del);return}
});

/* ====== Auto-refresh setiap 5 detik (untuk sinkron antar-tab/device) ====== */
setInterval(function(){
  if(st.blobId&&st.loaded&&!document.hidden){
    dbGet().then(function(){
      if(cur=='home'||cur=='res'||cur=='pickfill'||cur=='pickres')render();
    }).catch(function(){});
  }
},5000);

/* ====== Boot ====== */
st.user=getUser();
st.blobId=getBlobId();
if(st.blobId){
  dbGet().then(function(){
    // Seed survei transportasi HANYA jika database masih kosong
    if(st.s.length===0&&st.user&&st.user.role=='pembuat'){
      // Jangan auto-seed, biarkan user buat sendiri
    }
    render();
  }).catch(function(e){
    stamp();
    M.innerHTML='<div class="dberr"><b>Gagal memuat database.</b> '+e.message+'<br><br><button class="btn" onclick="location.reload()">Coba lagi</button></div>';
  });
} else {
  // Cek apakah URL hash punya #setup
  if(location.hash=='#setup'){$('#setupm').classList.add('on')}
  render();
}
</script>
</body>
</html>
