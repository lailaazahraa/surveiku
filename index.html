C.addSurvey=function(v){v.owner=C.user.uid;v.ownerName=C.user.displayName;return mut(function(d){d.surveys.push(v)})};
C.updSurvey=function(id,ch){return mut(function(d){d.surveys.forEach(function(x){if(x.id==id&&x.owner==C.user.uid)for(var k in ch)x[k]=ch[k]})})};
C.delSurvey=function(id){return mut(function(d){d.surveys=d.surveys.filter(function(x){return !(x.id==id&&x.owner==C.user.uid)});delete d.resp[id]})};
C.addResp=function(sid,a){var id=sid+'_'+C.user.uid;return mut(function(d){if(d.done.indexOf(id)>=0)return{code:'permission-denied',message:'denied'};d.done.push(id);(d.resp[sid]=d.resp[sid]||[]).push(a)})};
cloudMerge();poll(true);setInterval(function(){if(!document.hidden)poll(false)},5000)}
function initLocal(){var K='sf3';
function rd(){var d={surveys:[],resp:{},done:[],user:null};try{var x=JSON.parse(localStorage.getItem(K));if(x)for(var k in x)d[k]=x[k]}catch(e){}return d}
function wr(d){try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
var C=window.CLOUD={on:true,local:true,user:null,surveys:[],resp:{},done:[],sloaded:true};
function sync(){var d=rd();C.surveys=d.surveys;C.resp=d.resp;C.done=d.done;C.user=d.user}
function ok(){sync();window.onCloud();return Promise.resolve()}
C.login=function(){if(window.GID){gLogin();return}$('#lerr').textContent='';$('#lm').classList.add('on');$('#ln').focus()};
C.loginDo=function(n,role){var d=rd();d.user={uid:'l_'+n.toLowerCase().replace(/\s+/g,'_'),displayName:n,role:role};wr(d);sync();window.onAuth();window.onCloud()};
C.logout=function(){var d=rd();d.user=null;wr(d);sync();window.onAuth();window.onCloud()};
C.setUser=function(u){var d=rd();d.user=u;wr(d);sync();window.onAuth();window.onCloud()};
C.addSurvey=function(v){var d=rd();v.owner=d.user.uid;v.ownerName=d.user.displayName;d.surveys.push(v);wr(d);return ok()};
C.updSurvey=function(id,ch){var d=rd();d.surveys.forEach(function(x){if(x.id==id)for(var k in ch)x[k]=ch[k]});wr(d);return ok()};
C.delSurvey=function(id){var d=rd();d.surveys=d.surveys.filter(function(x){return x.id!=id});delete d.resp[id];wr(d);return ok()};
C.addResp=function(sid,a){var d=rd(),id=sid+'_'+d.user.uid;if(d.done.indexOf(id)>=0)return Promise.reject({code:'permission-denied',message:'denied'});d.done.push(id);(d.resp[sid]=d.resp[sid]||[]).push(a);wr(d);return ok()};
window.addEventListener('storage',function(e){if(e.key==K){sync();window.onAuth();window.onCloud()}});
sync();cloudMerge()}
$('#lgo').onclick=function(){var n=$('#ln').value.trim();if(!n){$('#lerr').textContent='Isi nama Anda.';return}window.CLOUD.loginDo(n,document.querySelector('input[name=lr]:checked').value);$('#lm').classList.remove('on')};
$('#lcx').onclick=function(){$('#lm').classList.remove('on')};
function dbId(){var m=/[#&]db=([^&]+)/.exec(location.hash);if(m){try{localStorage.setItem('sf_db',m[1])}catch(e){}return m[1]}try{return window.DB_BLOB||localStorage.getItem('sf_db')||''}catch(e){return window.DB_BLOB||''}}
function setupView(){M.innerHTML='<div class="hd"><div><h1>Aktifkan Database Bersama</h1><p class="sub">Dilakukan sekali oleh pembuat web.</p></div></div><div class="card"><p class="note" style="margin-top:0">Tekan tombol di bawah. Web akan membuat database bersama lalu memberi satu tautan resmi. Pakai tautan itu untuk semua orang, termasuk dosen.</p><button class="btn" id="mk" type="button">Buat database bersama</button><div id="mo" class="note" style="margin-top:12px"></div></div>';
$('#mk').onclick=function(){$('#mo').textContent='Membuat...';fetch((window.DB_URL||'https://jsonblob.com/api/jsonBlob/').replace(/\/$/,''),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({surveys:[],resp:{},done:[]})}).then(function(r){var l=r.headers.get('Location')||r.headers.get('X-jsonblob')||'',id=l.split('/').pop();if(!id)throw new Error('ID tidak terbaca');
try{localStorage.setItem('sf_db',id)}catch(e){}var u=base()+'#db='+id;$('#mo').innerHTML='<b>Berhasil.</b> Tautan resmi web (salin, pakai untuk semua orang):<input readonly value="'+u+'" onclick="this.select()" style="margin-top:8px"><p><button class="btn" id="gc" type="button">Lanjut</button></p><p class="note">Setelah menekan Lanjut, web memakai database bersama. Kirim tautan di atas ke teman dan dosen.</p>';$('#gc').onclick=function(){try{var u=(JSON.parse(localStorage.getItem('sf3'))||{}).user;if(u)localStorage.setItem('sf_user',JSON.stringify(u))}catch(e){}location.hash='#db='+id;location.reload()}}).catch(function(e){$('#mo').textContent=isWeb()?'Gagal membuat database ('+e.message+'). Periksa koneksi internet lalu coba lagi.':'Gagal: halaman ini dibuka dari pratinjau yang memblokir koneksi. Buka web lewat alamat GitHub Pages Anda (https://...github.io/...), lalu ulangi langkah ini.'})}}
function boot(){try{window.GID=window.GOOGLE_CLIENT_ID||localStorage.getItem('sf_gid')||''}catch(e){window.GID=window.GOOGLE_CLIENT_ID||''}window.DB_FIXED=!!window.DB_BLOB;window.DB_BLOB=dbId();load();if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey){}else if(window.DB_BLOB)initRemote();else initLocal();route();if(location.hash=='#setup'&&!window.DB_BLOB)cur='setup';render();stamp()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot()
</script>
<script type="module">
var cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey){try{
const V='https://www.gstatic.com/firebasejs/10.12.2/';
const [A,F,U]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js'),import(V+'firebase-auth.js')]);
const app=A.initializeApp(cfg),db=F.getFirestore(app),au=U.getAuth(app);
const PV={google:()=>new U.GoogleAuthProvider(),apple:()=>new U.OAuthProvider('apple.com'),microsoft:()=>new U.OAuthProvider('microsoft.com'),github:()=>new U.GithubAuthProvider()};
const C=window.CLOUD={on:true,user:null,surveys:[],resp:{},done:[],
login:p=>U.signInWithPopup(au,(PV[p]||PV.google)()).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('Login gagal: '+e.message)}),
logout:()=>U.signOut(au),
addSurvey:s=>F.setDoc(F.doc(db,'surveys',s.id),{title:s.title,desc:s.desc||'',qs:s.qs,login:!!s.login,owner:C.user.uid,ownerName:C.user.displayName||'',createdAt:F.serverTimestamp()}),
updSurvey:(id,ch)=>F.updateDoc(F.doc(db,'surveys',id),ch),
delSurvey:id=>F.deleteDoc(F.doc(db,'surveys',id)),
addResp:(sid,a)=>C.user?F.setDoc(F.doc(db,'responses',sid+'_'+C.user.uid),{surveyId:sid,answers:a,ts:F.serverTimestamp()}):F.addDoc(F.collection(db,'responses'),{surveyId:sid,answers:a,ts:F.serverTimestamp()})};
const bad=e=>window.onCloudErr(e.code||e.message);
U.onAuthStateChanged(au,u=>{C.user=u;window.onAuth()});
F.onSnapshot(F.collection(db,'surveys'),s=>{C.surveys=s.docs.map(d=>{const x=d.data();return{id:d.id,title:x.title,desc:x.desc,qs:x.qs,owner:x.owner,ownerName:x.ownerName||'',login:!!x.login}});C.sloaded=true;window.onCloud()},bad);
F.onSnapshot(F.collection(db,'responses'),s=>{const r={};C.done=s.docs.map(d=>d.id);s.docs.forEach(d=>{const x=d.data();(r[x.surveyId]=r[x.surveyId]||[]).push(x.answers)});C.resp=r;window.onCloud()},bad);
}catch(e){window.onCloudErr(e.message)}}
</script>
