C.setUser=function(u){C.user=u;try{localStorage.setItem(KU,JSON.stringify(u))}catch(e){}window.onAuth();window.onCloud()};
C.setCfg=function(ch){return mut(function(d){d.cfg=d.cfg||{};for(var k in ch)d.cfg[k]=ch[k]})};
C.addSurvey=function(v){v.owner=C.user.uid;v.ownerName=C.user.displayName;return mut(function(d){d.surveys.push(v)})};
C.updSurvey=function(id,ch){return mut(function(d){d.surveys.forEach(function(x){if(x.id==id&&x.owner==C.user.uid)for(var k in ch)x[k]=ch[k]})})};
C.delSurvey=function(id){return mut(function(d){d.surveys=d.surveys.filter(function(x){return !(x.id==id&&x.owner==C.user.uid)});delete d.resp[id]})};
C.addResp=function(sid,a){var id=sid+'_'+C.user.uid;return mut(function(d){if(d.done.indexOf(id)>=0)return{code:'permission-denied',message:'denied'};d.done.push(id);(d.resp[sid]=d.resp[sid]||[]).push(a)})};

function initLocal(){var K='sf3';
function rd(){var d={surveys:[],resp:{},done:[],user:null};try{var x=JSON.parse(localStorage.getItem(K));if(x)for(var k in x)d[k]=x[k]}catch(e){}return d}
function wr(d){try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}}
var C=window.CLOUD={on:true,local:true,user:null,surveys:[],resp:{},done:[],sloaded:true};
function sync(){var d=rd();C.surveys=d.surveys;C.resp=d.resp;C.done=d.done;C.user=d.user}
function ok(){sync();window.onCloud();return Promise.resolve()}
C.login=function(){if(window.GID){gLogin();return}$('#lerr').textContent='';$('#lm').classList.add('on');$('#ln').focus()};
C.loginDo=function(n,role){var d=rd();d.user={uid:'l_'+n.toLowerCase().replace(/\s+/g,'_'),displayName:n,role:role};wr(d);sync();window.onAuth();window.onCloud()};
C.logout=function(){var d=rd();d.user=null;wr(d);sync();window.onAuth();window.onCloud()};

var cfg=window.FIREBASE_CONFIG;
if(cfg&&cfg.apiKey){try{
const V='https://www.gstatic.com/firebasejs/10.12.2/';
const [A,F,U]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js'),import(V+'firebase-auth.js')]);
const app=A.initializeApp(cfg),db=F.getFirestore(app),au=U.getAuth(app);
const PV={google:()=>new U.GoogleAuthProvider(),apple:()=>new U.OAuthProvider('apple.com'),microsoft:()=>new U.OAuthProvider('microsoft.com'),github:()=>new U.GithubAuthProvider()};
const C=window.CLOUD={on:true,user:null,surveys:[],resp:{},done:[],
login:p=>U.signInWithPopup(au,(PV[p]||PV.google)()).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')alert('Login gagal: '+e.message)}),
logout:()=>U.signOut(au),
addSurvey:s=>F.setDoc(F.doc(db,'surveys',s.id),{title:s.title,desc:s.desc||'',qs:s.qs,login:!!s.login,owner:C.user.uid,ownerName:C.user.displayName||'',createdAt:F.serverTimestamp()}),
updSurvey:(id,ch)=>F.updateDoc(F.doc(db,'surveys',id),ch),
delSurvey:id=>F.deleteDoc(F.doc(db,'surveys',id)),
addResp:(sid,a)=>C.user?F.setDoc(F.doc(db,'responses',sid+'_'+C.user.uid),{surveyId:sid,answers:a,ts:F.serverTimestamp()}):F.addDoc(F.collection(db,'responses'),{surveyId:sid,answers:a,ts:F.serverTimestamp()})};
const bad=e=>window.onCloudErr(e.code||e.message);
U.onAuthStateChanged(au,u=>{C.user=u;window.onAuth()});
F.onSnapshot(F.collection(db,'surveys'),s=>{C.surveys=s.docs.map(d=>{const x=d.data();return{id:d.id,title:x.title,desc:x.desc,qs:x.qs,owner:x.owner,ownerName:x.ownerName||'',login:!!x.login}});C.sloaded=true;window.onCloud()},bad);
F.onSnapshot(F.collection(db,'responses'),s=>{const r={};C.done=s.docs.map(d=>d.id);s.docs.forEach(d=>{const x=d.data();(r[x.surveyId]=r[x.surveyId]||[]).push(x.answers)});C.resp=r;window.onCloud()},bad);
}catch(e){window.onCloudErr(e.message)}}
</script>
